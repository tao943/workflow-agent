[pytest]
pythonpath = .
testpaths = tests
addopts = -p no:cacheprovider
markers =
    integration: tests that call real local/external integrations
    e2e: end-to-end CLI/runtime tests
    rag: real RAG service tests
    mcp: real MCP server tests
    docker: real Docker skill sandbox tests
    benchmark: benchmark harness and baseline task tests
    deepeval: optional DeepEval metric integration tests
    external_benchmark: AgentBench/Claw-Eval adapter tests
